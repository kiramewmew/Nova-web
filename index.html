<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi App Tecnológica</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<section class="seccion-media">
  <!-- Imagen Local -->
 <center>
    <img src="imagenes/portada.jpg" alt="Imagen de mi proyecto" class="img-fluida">
 </center>

  
  <!-- Video de YouTube (Opcional) -->
     <center>
    <div class="video-contenedor">
   <iframe width="560" height="315" src="https://www.youtube.com/embed/2iu7xGqiNzM?si=TxvHkll8wwEKHwx-" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>   
   </iframe>
   </center>
    </div>
</section>
<div class="contenedor-app">
    <header class="mi-header">
        <h1>Panel de Control</h1>
    </header>
    
    <main class="contenido">
        <p>Selecciona una opción para continuar:</p>
        
        <div class="grid-servicios">
            <div class="card" id="btn-reportar">
                <span class="icon">👾</span>
                <h3>Envía una alerta</h3>
            </div>
            
            <div class="card" id="btn-manual">
                <span class="icon">📝</span>
                <h3>Acceder al manual</h3>
            </div>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
