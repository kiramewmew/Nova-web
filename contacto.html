<div class="contenedor-app">
  <header class="mi-header">
    <h1>Enviar Reporte</h1>
  </header>
  
  <main class="contenido">
    <form id="formulario-contacto">
      <label>Tu Nombre:</label>
      <input type="email" id="campo-email" placeholder="Ej: abc@gmail.com" required>
      
      <label>¿Cuál es tu personaje fav?:</label>
      <textarea id="campo-mensaje" placeholder="Escribe aquí tu personaje favorito" required></textarea>
      
      <button type="submit" class="boton-app">ENVIAR AHORA</button>
    </form>
  </main>
</div>

<script src="script.js"></script>
